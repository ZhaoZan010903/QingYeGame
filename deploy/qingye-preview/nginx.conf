worker_processes 1;
user nginx;
pid /run/qingye-preview/nginx.pid;
error_log /var/log/qingye-preview/error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/qingye-preview/access.log;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_body_temp_path /var/lib/qingye-preview/client_temp;
    proxy_temp_path /var/lib/qingye-preview/proxy_temp;
    fastcgi_temp_path /var/lib/qingye-preview/fastcgi_temp;
    uwsgi_temp_path /var/lib/qingye-preview/uwsgi_temp;
    scgi_temp_path /var/lib/qingye-preview/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    server {
        listen 5178;
        server_name _;
        root /var/www/qingye-preview/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /favicon.ico { access_log off; return 204; }
        location = /index.html { add_header Cache-Control "no-store"; }
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
