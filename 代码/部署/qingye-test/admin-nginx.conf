worker_processes 1;
user nginx;
pid /run/qingye-test-admin-web/nginx.pid;
error_log /var/log/qingye-test-admin-web/error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Deliberately omit query strings, including short-lived upload tickets.
    log_format qingye '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time $upstream_response_time';
    access_log /var/log/qingye-test-admin-web/access.log qingye;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 11m;
    client_body_temp_path /var/lib/qingye-test-admin-web/client_temp;
    proxy_temp_path /var/lib/qingye-test-admin-web/proxy_temp;
    fastcgi_temp_path /var/lib/qingye-test-admin-web/fastcgi_temp;
    uwsgi_temp_path /var/lib/qingye-test-admin-web/uwsgi_temp;
    scgi_temp_path /var/lib/qingye-test-admin-web/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    server {
        listen 5181;
        server_name _;
        root /var/www/qingye-admin/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control no-store always;
        location = /favicon.ico { access_log off; return 204; }
        location /assets/ { try_files $uri =404; }
        location /api/ {
            proxy_pass http://127.0.0.1:5182;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location / { try_files $uri $uri/ /index.html; }
        location ~ /\. { deny all; }
    }
}
