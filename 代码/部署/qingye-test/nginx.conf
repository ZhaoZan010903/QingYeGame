worker_processes 1;
user nginx;
pid /run/qingye-test-web/nginx.pid;
error_log /var/log/qingye-test-web/error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format qingye '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time $upstream_response_time';
    access_log /var/log/qingye-test-web/access.log qingye;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 11m;
    client_body_temp_path /var/lib/qingye-test-web/client_temp;
    proxy_temp_path /var/lib/qingye-test-web/proxy_temp;
    fastcgi_temp_path /var/lib/qingye-test-web/fastcgi_temp;
    uwsgi_temp_path /var/lib/qingye-test-web/uwsgi_temp;
    scgi_temp_path /var/lib/qingye-test-web/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    map $uri $qingye_cache_control {
        default "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }
    server {
        listen 5179 ssl;
        ssl_certificate /etc/qingye-test/tls/current/fullchain.pem;
        ssl_certificate_key /etc/qingye-test/tls/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:QingYeTLS:2m;
        # Keep bookmarked HTTP links usable. UDP 5179 is served by Go WebTransport.
        error_page 497 =308 https://152.136.252.204:5179$request_uri;
        server_name _;
        root /var/www/qingye-test/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://qingye-images-20261.oss-cn-beijing.aliyuncs.com; connect-src 'self' wss://152.136.252.204:5179; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control $qingye_cache_control always;
        location = /favicon.ico { access_log off; return 204; }
        location /assets/ {
            try_files $uri =404;
        }
        # API includes permission-checked local media; never fall through to the SPA.
        location /api/v1/admin { return 404; }
        # Same HTTPS port for proxy-compatible chat; the ticket query is excluded from access logs.
        location = /api/v1/chat/socket {
            proxy_pass http://127.0.0.1:5180;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 75s;
            proxy_send_timeout 15s;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:5180;
            proxy_http_version 1.1;
            # Stream to Go so rejected upload tickets do not first fill Nginx's disk buffer.
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location / { try_files $uri $uri/ /index.html; }
        location ~ /\. { deny all; }
    }
}
