# Merge these locations into the existing dedicated :5178 server block.
# Only deploy frontend/web/dist to the web root; keep source and credentials private.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
}
location /api/ {
    # Demo preview has no backend; never serve SPA HTML as an API response.
    default_type application/json;
    return 503 '{"code":"API_NOT_CONFIGURED","message":"业务接口尚未配置"}';
}
location / {
    try_files $uri $uri/ /index.html;
}
