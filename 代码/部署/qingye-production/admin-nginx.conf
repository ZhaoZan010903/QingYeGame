worker_processes 1;
user www;
pid /run/qingye-production/admin/nginx.pid;
error_log /var/log/qingye-production/admin/error.log warn;
events { worker_connections 256; }
http {
    # 宝塔编译的Lua模块需要显式绝对路径，独立-p不能继承主站http配置。
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    include /www/server/nginx/conf/mime.types;
    default_type application/octet-stream;
    # 不记录查询参数，避免短期上传和聊天票据进入访问日志。
    log_format qingye '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time $upstream_response_time';
    access_log /var/log/qingye-production/admin/access.log qingye;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 11m;
    client_body_temp_path /var/lib/qingye-production/nginx/admin/client_temp;
    proxy_temp_path /var/lib/qingye-production/nginx/admin/proxy_temp;
    fastcgi_temp_path /var/lib/qingye-production/nginx/admin/fastcgi_temp;
    uwsgi_temp_path /var/lib/qingye-production/nginx/admin/uwsgi_temp;
    scgi_temp_path /var/lib/qingye-production/nginx/admin/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    server {
        listen 5181 ssl;
        ssl_certificate /etc/qingye-production/tls/current/fullchain.pem;
        ssl_certificate_key /etc/qingye-production/tls/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:QingYeProductionAdminTLS:2m;
        error_page 497 =308 https://8.140.230.149:5181$request_uri;
        server_name 8.140.230.149;
        root /var/www/qingye-production/admin/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://qingye-images-20261.oss-cn-beijing.aliyuncs.com; connect-src 'self' wss://8.140.230.149:5181; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control no-store always;
        location = /favicon.ico { access_log off; return 204; }
        location /assets/ { try_files $uri =404; }
        location = /api/v1/admin/chat/socket {
            proxy_pass http://127.0.0.1:5182;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 75s;
            proxy_send_timeout 15s;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:5182;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location / { try_files $uri $uri/ /index.html; }
        location ~ /\. { deny all; }
    }
}
