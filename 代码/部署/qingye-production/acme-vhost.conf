# 仅由既有宝塔Nginx加载本验证入口；不能替换它的主配置或其他站点。
# 安装前检查是否已有相同listen/server_name，避免名称冲突。
server {
    listen 80;
    server_name 8.140.230.149;
    server_tokens off;
    access_log /var/log/qingye-production/acme-access.log;
    error_log /var/log/qingye-production/acme-error.log warn;
    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
        root /var/lib/qingye-production/acme;
        types { }
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 444; }
}
